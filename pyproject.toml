[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "k-geopolitical-monitor"
version = "0.1.0"
description = "Global geopolitical monitoring system"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.116,<1",
  "uvicorn>=0.35,<1",
  "psycopg[binary]>=3.3,<4",
]

[project.optional-dependencies]
test = [
  "pytest>=8.0,<10",
  "httpx2>=2.12,<3",
  "anyio>=4.14.2,<4.15",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
filterwarnings = [
  "error::DeprecationWarning",
  "error::starlette.exceptions.StarletteDeprecationWarning",
]
