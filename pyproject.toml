[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "k-geopolitical-monitor"
version = "0.1.0"
description = "Global geopolitical monitoring system"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.116,<1",
    "uvicorn>=0.35,<1",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "httpx>=0.28,<1",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
