name: E9A6 State-Preserving Real Host Validation

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/e9a6-real-host-state-preserving.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e9a6-real-host-validation
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      E4_HOST: ${{ secrets.E4_HOST }}
      E4_SSH_PRIVATE_KEY: ${{ secrets.E4_SSH_PRIVATE_KEY }}
      E4_SSH_KNOWN_HOSTS: ${{ secrets.E4_SSH_KNOWN_HOSTS }}
      E4_SSH_USER: ubuntu
      PROJECT_ROOT: /opt/k-geopolitical-monitor
      DEPLOY_SHA: ${{ github.sha }}
      VALIDATION_ID: ${{ github.run_id }}

    steps:
      - name: Validate connection secrets
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$E4_HOST"
          test -n "$E4_SSH_PRIVATE_KEY"
          test -n "$E4_SSH_KNOWN_HOSTS"
          test -n "$DEPLOY_SHA"

      - name: Configure pinned SSH
        shell: bash
        run: |
          set -Eeuo pipefail
          install -d -m 0700 "$HOME/.ssh"
          printf '%s\n' "$E4_SSH_PRIVATE_KEY" > "$HOME/.ssh/id_e9a6"
          chmod 0600 "$HOME/.ssh/id_e9a6"
          printf '%s\n' "$E4_SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 0600 "$HOME/.ssh/known_hosts"

      - name: Preflight and state-preserving immutable deployment
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh \
            -i "$HOME/.ssh/id_e9a6" \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=10 \
            "$E4_SSH_USER@$E4_HOST" \
            "DEPLOY_SHA='$DEPLOY_SHA' VALIDATION_ID='$VALIDATION_ID' sudo -n -E bash -s" <<'REMOTE'
          set -Eeuo pipefail
          root=/opt/k-geopolitical-monitor
          db="$root/data/kgeopolitical_monitor.db"
          test "$(uname -m)" = "aarch64"
          . /etc/os-release
          test "$ID" = "ubuntu"
          test "$VERSION_ID" = "24.04"
          test -d "$root/.git"
          test -f "$db"
          test "$(systemctl is-active kgm-monitor.service)" = "active"
          test "$(sqlite3 "$db" 'PRAGMA integrity_check;')" = "ok"
          old_sha="$(git -C "$root" rev-parse HEAD)"
          test -z "$(git -C "$root" status --porcelain --untracked-files=no)"
          evidence="$root/data/e9a6_validation"
          mkdir -p "$evidence"
          chown kgm:kgm "$evidence"
          chmod 0750 "$evidence"
          pre_backup="$evidence/pre_deploy_${VALIDATION_ID}.db"
          test ! -e "$pre_backup"
          runuser -u kgm -- env PROJECT_ROOT="$root" BACKUP_PATH="$pre_backup" \
            "$root/.venv/bin/python" - <<'PY'
          import os
          from kgeopolitical_monitor.runtime_backup import backup_project_database
          backup_project_database(os.environ["PROJECT_ROOT"], os.environ["BACKUP_PATH"])
          PY
          test "$(sqlite3 "$pre_backup" 'PRAGMA integrity_check;')" = "ok"
          chmod 0600 "$pre_backup"

          deployment_started=0
          rollback() {
            rc=$?
            if [ "$rc" -ne 0 ] && [ "$deployment_started" -eq 1 ]; then
              echo "e9a6_deployment_rollback=ATTEMPTED"
              systemctl stop kgm-monitor.service 2>/dev/null || true
              git -C "$root" checkout --detach "$old_sha" || true
              KGM_ALLOW_EXISTING_STATE=1 bash "$root/deployment/scripts/e4_bootstrap_ubuntu_arm64.sh" --project-root "$root" || true
            fi
            exit "$rc"
          }
          trap rollback EXIT

          systemctl stop kgm-monitor.service
          deployment_started=1
          git -C "$root" fetch --depth=1 origin "$DEPLOY_SHA"
          git -C "$root" checkout --detach "$DEPLOY_SHA"
          test "$(git -C "$root" rev-parse HEAD)" = "$DEPLOY_SHA"
          KGM_ALLOW_EXISTING_STATE=1 bash "$root/deployment/scripts/e4_bootstrap_ubuntu_arm64.sh" --project-root "$root"
          test "$(git -C "$root" rev-parse HEAD)" = "$DEPLOY_SHA"
          test "$(systemctl is-active kgm-monitor.service)" = "active"
          test "$(systemctl is-enabled kgm-monitor.service)" = "enabled"
          test "$(sqlite3 "$db" 'PRAGMA integrity_check;')" = "ok"
          deployment_started=0
          trap - EXIT
          echo "previous_deployed_sha=$old_sha"
          echo "current_deployed_sha=$DEPLOY_SHA"
          echo "state_preserving_deployment=PASS"
          REMOTE

      - name: Verify effective hardened systemd boundary
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh -i "$HOME/.ssh/id_e9a6" -o BatchMode=yes -o StrictHostKeyChecking=yes \
            "$E4_SSH_USER@$E4_HOST" 'sudo -n bash -s' <<'REMOTE'
          set -Eeuo pipefail
          props="$(systemctl show kgm-monitor.service \
            --property=User --property=Group --property=NoNewPrivileges \
            --property=PrivateTmp --property=PrivateDevices \
            --property=ProtectSystem --property=ProtectHome \
            --property=ProtectKernelTunables --property=ProtectKernelModules \
            --property=ProtectKernelLogs --property=ProtectControlGroups \
            --property=ProtectClock --property=ProtectHostname \
            --property=LockPersonality --property=RestrictRealtime \
            --property=RestrictSUIDSGID --property=RestrictNamespaces \
            --property=SystemCallArchitectures --property=RestrictAddressFamilies \
            --property=CapabilityBoundingSet --property=AmbientCapabilities \
            --property=ReadWritePaths --no-pager)"
          for required in \
            'User=kgm' 'Group=kgm' 'NoNewPrivileges=yes' 'PrivateTmp=yes' \
            'PrivateDevices=yes' 'ProtectSystem=strict' 'ProtectHome=yes' \
            'ProtectKernelTunables=yes' 'ProtectKernelModules=yes' \
            'ProtectKernelLogs=yes' 'ProtectControlGroups=yes' \
            'ProtectClock=yes' 'ProtectHostname=yes' 'LockPersonality=yes' \
            'RestrictRealtime=yes' 'RestrictSUIDSGID=yes' 'RestrictNamespaces=yes' \
            'ReadWritePaths=/opt/k-geopolitical-monitor/data' \
            'CapabilityBoundingSet=' 'AmbientCapabilities='; do
            printf '%s\n' "$props" | grep -Fxq "$required"
          done
          arch_line="$(printf '%s\n' "$props" | grep '^SystemCallArchitectures=')"
          printf '%s\n' "$arch_line" | grep -q 'native'
          families="$(printf '%s\n' "$props" | grep '^RestrictAddressFamilies=')"
          for family in AF_UNIX AF_INET AF_INET6; do
            printf '%s\n' "$families" | grep -q "$family"
          done
          test "$(stat -c %U:%G /etc/systemd/system/kgm-monitor.service)" = "root:root"
          test "$(stat -c %a /etc/systemd/system/kgm-monitor.service)" = "644"
          test "$(stat -c %U:%G /opt/k-geopolitical-monitor)" = "root:root"
          test "$(stat -c %U:%G /opt/k-geopolitical-monitor/data)" = "kgm:kgm"
          echo "effective_systemd_hardening=PASS"
          REMOTE

      - name: Verify second-instance fail-closed and service restart
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh -i "$HOME/.ssh/id_e9a6" -o BatchMode=yes -o StrictHostKeyChecking=yes \
            "$E4_SSH_USER@$E4_HOST" 'sudo -n bash -s' <<'REMOTE'
          set -Eeuo pipefail
          root=/opt/k-geopolitical-monitor
          set +e
          duplicate_output="$(runuser -u kgm -- "$root/.venv/bin/python" -m kgeopolitical_monitor.unattended_runner --project-root "$root" --once 2>&1)"
          duplicate_rc=$?
          set -e
          test "$duplicate_rc" -ne 0
          printf '%s\n' "$duplicate_output" | grep -Fq 'another unattended runtime instance already holds the lease'
          echo "second_instance_rejection=PASS"
          systemctl restart kgm-monitor.service
          systemctl is-active --quiet kgm-monitor.service
          sqlite3 "$root/data/kgeopolitical_monitor.db" 'PRAGMA integrity_check;' | grep -qx ok
          echo "service_restart_integrity=PASS"
          REMOTE

      - name: Exercise emergency kill and recovery procedure
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh -i "$HOME/.ssh/id_e9a6" -o BatchMode=yes -o StrictHostKeyChecking=yes \
            "$E4_SSH_USER@$E4_HOST" 'sudo -n bash -s' <<'REMOTE'
          set -Eeuo pipefail
          root=/opt/k-geopolitical-monitor
          systemctl disable --now kgm-monitor.service
          test "$(systemctl is-active kgm-monitor.service 2>/dev/null || true)" != "active"
          test "$(systemctl is-enabled kgm-monitor.service 2>/dev/null || true)" != "enabled"
          sqlite3 "$root/data/kgeopolitical_monitor.db" 'PRAGMA integrity_check;' | grep -qx ok
          systemctl enable --now kgm-monitor.service
          systemctl is-enabled --quiet kgm-monitor.service
          systemctl is-active --quiet kgm-monitor.service
          echo "kill_disable_reenable_recovery=PASS"
          REMOTE

      - name: Execute real-host clean-project-root DR drill
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh -i "$HOME/.ssh/id_e9a6" -o BatchMode=yes -o StrictHostKeyChecking=yes \
            "$E4_SSH_USER@$E4_HOST" \
            "VALIDATION_ID='$VALIDATION_ID' DEPLOY_SHA='$DEPLOY_SHA' sudo -n -E bash -s" <<'REMOTE'
          set -Eeuo pipefail
          root=/opt/k-geopolitical-monitor
          evidence="$root/data/e9a6_validation"
          bundle="$evidence/runtime_bundle_${VALIDATION_ID}"
          restore_root="/tmp/kgm-e9a6-restore-${VALIDATION_ID}"
          test ! -e "$bundle"
          rm -rf "$restore_root"
          recovery_start="$(date +%s)"
          runuser -u kgm -- env PROJECT_ROOT="$root" BUNDLE_PATH="$bundle" SOURCE_COMMIT="$DEPLOY_SHA" \
            "$root/.venv/bin/python" - <<'PY'
          import os
          from kgeopolitical_monitor.runtime_backup import create_runtime_backup_bundle, verify_runtime_backup_bundle
          path = create_runtime_backup_bundle(
              os.environ["PROJECT_ROOT"],
              os.environ["BUNDLE_PATH"],
              source_commit=os.environ["SOURCE_COMMIT"],
          )
          manifest = verify_runtime_backup_bundle(path)
          assert manifest["source_commit"] == os.environ["SOURCE_COMMIT"]
          assert manifest["canonical_storage_policy"] == "PROJECT_LOCAL_ONLY"
          PY
          mkdir -p "$restore_root"
          chown kgm:kgm "$restore_root"
          runuser -u kgm -- env BUNDLE_PATH="$bundle" RESTORE_ROOT="$restore_root" \
            "$root/.venv/bin/python" - <<'PY'
          import os
          from kgeopolitical_monitor.runtime_backup import restore_runtime_backup_bundle, verify_runtime_backup_bundle
          verify_runtime_backup_bundle(os.environ["BUNDLE_PATH"])
          restore_runtime_backup_bundle(os.environ["BUNDLE_PATH"], os.environ["RESTORE_ROOT"])
          PY
          sqlite3 "$restore_root/data/kgeopolitical_monitor.db" 'PRAGMA integrity_check;' | grep -qx ok
          env SOURCE_DB="$root/data/kgeopolitical_monitor.db" RESTORED_DB="$restore_root/data/kgeopolitical_monitor.db" \
            "$root/.venv/bin/python" - <<'PY'
          import os, sqlite3
          def counts(path):
              with sqlite3.connect(path) as con:
                  tables = [r[0] for r in con.execute(
                      "SELECT name FROM sqlite_master WHERE type='table' AND name NOT LIKE 'sqlite_%' ORDER BY name"
                  )]
                  return {name: con.execute(f'SELECT COUNT(*) FROM "{name}"').fetchone()[0] for name in tables}
          source = counts(os.environ["SOURCE_DB"])
          restored = counts(os.environ["RESTORED_DB"])
          assert source == restored
          assert source
          print(f"restored_table_count={len(source)}")
          PY
          runuser -u kgm -- "$root/.venv/bin/python" -m kgeopolitical_monitor.unattended_runner \
            --project-root "$restore_root" --once
          sqlite3 "$restore_root/data/kgeopolitical_monitor.db" 'PRAGMA integrity_check;' | grep -qx ok
          recovery_end="$(date +%s)"
          elapsed="$((recovery_end - recovery_start))"
          env BUNDLE_PATH="$bundle" RECOVERY_END="$recovery_end" RECOVERY_ELAPSED="$elapsed" \
            "$root/.venv/bin/python" - <<'PY'
          import json, os
          from datetime import datetime, timezone
          manifest = json.load(open(os.path.join(os.environ["BUNDLE_PATH"], "manifest.json"), encoding="utf-8"))
          captured = datetime.fromisoformat(manifest["captured_at"])
          end = datetime.fromtimestamp(int(os.environ["RECOVERY_END"]), timezone.utc)
          age = max(0.0, (end - captured).total_seconds())
          elapsed = int(os.environ["RECOVERY_ELAPSED"])
          print(f"dr_recovery_elapsed_seconds={elapsed}")
          print(f"dr_recovery_point_age_seconds={age:.3f}")
          assert elapsed <= 7200
          assert age <= 86400
          PY
          rm -rf "$restore_root"
          echo "real_host_clean_project_root_dr=PASS"
          echo "rto_objective_evaluation=PASS"
          echo "rpo_objective_evaluation=PASS"
          REMOTE

      - name: Prepare deterministic interrupted-run reboot gate
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh -i "$HOME/.ssh/id_e9a6" -o BatchMode=yes -o StrictHostKeyChecking=yes \
            "$E4_SSH_USER@$E4_HOST" \
            "sudo -n $PROJECT_ROOT/.venv/bin/python -m kgeopolitical_monitor.e4_host_validation --project-root $PROJECT_ROOT prepare-reboot"

      - name: Reboot OCI host
        shell: bash
        run: |
          set -Eeuo pipefail
          set +e
          ssh -i "$HOME/.ssh/id_e9a6" -o BatchMode=yes -o StrictHostKeyChecking=yes \
            "$E4_SSH_USER@$E4_HOST" 'sudo -n systemctl reboot'
          reboot_rc=$?
          set -e
          if [[ "$reboot_rc" -ne 0 && "$reboot_rc" -ne 255 ]]; then
            exit "$reboot_rc"
          fi

      - name: Wait for SSH after real reboot
        shell: bash
        run: |
          set -Eeuo pipefail
          ready=0
          for attempt in $(seq 1 60); do
            if ssh -i "$HOME/.ssh/id_e9a6" -o BatchMode=yes -o StrictHostKeyChecking=yes \
              -o ConnectTimeout=5 "$E4_SSH_USER@$E4_HOST" true >/dev/null 2>&1; then
              ready=1
              break
            fi
            sleep 5
          done
          test "$ready" -eq 1

      - name: Verify reboot interrupted-run recovery and final security state
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh -i "$HOME/.ssh/id_e9a6" -o BatchMode=yes -o StrictHostKeyChecking=yes \
            "$E4_SSH_USER@$E4_HOST" \
            "sudo -n $PROJECT_ROOT/.venv/bin/python -m kgeopolitical_monitor.e4_host_validation --project-root $PROJECT_ROOT verify-reboot --wait-seconds 180 --poll-seconds 3"
          ssh -i "$HOME/.ssh/id_e9a6" -o BatchMode=yes -o StrictHostKeyChecking=yes \
            "$E4_SSH_USER@$E4_HOST" \
            "DEPLOY_SHA='$DEPLOY_SHA' sudo -n -E bash -s" <<'REMOTE'
          set -Eeuo pipefail
          root=/opt/k-geopolitical-monitor
          test "$(git -C "$root" rev-parse HEAD)" = "$DEPLOY_SHA"
          systemctl is-enabled --quiet kgm-monitor.service
          systemctl is-active --quiet kgm-monitor.service
          sqlite3 "$root/data/kgeopolitical_monitor.db" 'PRAGMA integrity_check;' | grep -qx ok
          runuser -u kgm -- "$root/.venv/bin/python" - <<'PY'
          from kgeopolitical_monitor.e4_host_validation import collect_host_status
          payload = collect_host_status('/opt/k-geopolitical-monitor')
          ports = set(payload['public_listener_ports'])
          assert not ({80, 443, 3306, 5432} & ports)
          print('public_listener_ports=' + ','.join(str(p) for p in sorted(ports)))
          print('no_monitoring_http_https_database_listener=PASS')
          PY
          journal_hits="$(journalctl -u kgm-monitor.service --since '24 hours ago' --no-pager 2>/dev/null | grep -Eic 'BEGIN (OPENSSH|RSA|EC|DSA) PRIVATE KEY|Authorization:[[:space:]]*(Bearer|Basic)[[:space:]]+[^*[:space:]]|api[_-]?key[=:][[:space:]]*[^*[:space:]]+' || true)"
          echo "journal_secret_pattern_hits=$journal_hits"
          test "$journal_hits" -eq 0
          echo "final_real_host_runtime_security_gate=PASS"
          REMOTE
