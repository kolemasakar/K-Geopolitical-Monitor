name: P18.8 Closure Patch

on:
  push:
    branches:
      - docs/phase18-p18-8-validation-closure
    paths:
      - tools/p18_8_closure_trigger.txt

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout closure branch
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Apply guarded closure synchronization
        run: python tools/p18_8_closure_patch.py

      - name: Commit synchronized closure files and remove temporary patch machinery
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ROADMAP.md \
            docs/implementation/PHASE_18_SHARED_TEAM_RUNTIME_IMPLEMENTATION_PLAN.md \
            tests/test_p18_7_formal_closure.py
          git rm .github/workflows/p18_8_closure_patch.yml \
            tools/p18_8_closure_patch.py \
            tools/p18_8_closure_trigger.txt
          git commit -m "Synchronize P18.8 formal closure metadata"
          git push origin "HEAD:${GITHUB_REF_NAME}"
