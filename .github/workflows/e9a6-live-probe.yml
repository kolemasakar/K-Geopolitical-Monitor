name: E9A6 Real Host Live Probe

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/e9a6-live-probe.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      E4_HOST: ${{ secrets.E4_HOST }}
      E4_SSH_PRIVATE_KEY: ${{ secrets.E4_SSH_PRIVATE_KEY }}
      E4_SSH_KNOWN_HOSTS: ${{ secrets.E4_SSH_KNOWN_HOSTS }}
      E4_SSH_USER: ubuntu
    steps:
      - name: Configure pinned SSH
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$E4_HOST"
          test -n "$E4_SSH_PRIVATE_KEY"
          test -n "$E4_SSH_KNOWN_HOSTS"
          install -d -m 0700 "$HOME/.ssh"
          printf '%s\n' "$E4_SSH_PRIVATE_KEY" > "$HOME/.ssh/id_probe"
          chmod 0600 "$HOME/.ssh/id_probe"
          printf '%s\n' "$E4_SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 0600 "$HOME/.ssh/known_hosts"

      - name: Read-only port 111 and host firewall probe
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh -i "$HOME/.ssh/id_probe" -o BatchMode=yes -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=10 "$E4_SSH_USER@$E4_HOST" 'sudo -n bash -s' <<'REMOTE'
          set -Eeuo pipefail
          root=/opt/k-geopolitical-monitor
          echo "probe_sha=$(git -C "$root" rev-parse HEAD)"
          echo "probe_service_active=$(systemctl is-active kgm-monitor.service || true)"
          echo "probe_db_integrity=$(sqlite3 "$root/data/kgeopolitical_monitor.db" "PRAGMA integrity_check;")"
          echo "port_111_tcp_listeners_begin"
          ss -ltnp '( sport = :111 )' || true
          echo "port_111_tcp_listeners_end"
          echo "port_111_udp_listeners_begin"
          ss -lunp '( sport = :111 )' || true
          echo "port_111_udp_listeners_end"
          for unit in rpcbind.socket rpcbind.service nfs-server.service nfs-client.target; do
            echo "$unit enabled=$(systemctl is-enabled "$unit" 2>/dev/null || true) active=$(systemctl is-active "$unit" 2>/dev/null || true)"
          done
          echo "rpcbind_package=$(dpkg-query -W -f='${Status} ${Version}' rpcbind 2>/dev/null || echo absent)"
          echo "nfs_mount_count=$(findmnt -rn -t nfs,nfs4 | wc -l)"
          echo "nfs_fstab_count=$(grep -Ev '^[[:space:]]*(#|$)' /etc/fstab | grep -Ec '[[:space:]]nfs4?[[:space:]]' || true)"
          echo "rpcinfo_registered_programs_begin"
          rpcinfo -p 127.0.0.1 2>/dev/null || true
          echo "rpcinfo_registered_programs_end"
          if command -v ufw >/dev/null 2>&1; then
            echo "ufw_status_begin"
            ufw status verbose || true
            echo "ufw_status_end"
          else
            echo "ufw_status=UNAVAILABLE"
          fi
          echo "nft_input_policy_begin"
          nft list ruleset 2>/dev/null | grep -E 'hook input|policy (accept|drop|reject)|tcp dport (22|111)|udp dport 111' || true
          echo "nft_input_policy_end"
          echo "port_111_read_only_probe=PASS"
          REMOTE
