name: P12.5 Controlled Live Source Health Inventory

on:
  push:
    branches: [main]
    paths:
      - "src/kgeopolitical_monitor/source_health_egress.py"
      - "scripts/p12_5_live_health_inventory.py"
      - ".github/workflows/p12-5-controlled-live-health-inventory.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  controlled-live-health-inventory:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install project
        run: python -m pip install -e .
      - name: Run P12.5 controlled-live health inventory
        run: python scripts/p12_5_live_health_inventory.py
