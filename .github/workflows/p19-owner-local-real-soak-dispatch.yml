name: P19 Owner-Local Real Soak Dispatcher

on:
  workflow_dispatch:
  schedule:
    - cron: '27 */6 * * *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/p19-owner-local-real-soak-dispatch.yml'

permissions:
  contents: read
  actions: write

concurrency:
  group: p19-owner-local-soak-dispatch
  cancel-in-progress: false

jobs:
  dispatch-health:
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Validate dispatcher event
        shell: bash
        run: |
          set -Eeuo pipefail
          case "${{ github.event_name }}" in
            workflow_dispatch|schedule|push) ;;
            *) echo 'Unsupported dispatcher event' >&2; exit 41 ;;
          esac

      - name: Dispatch accepted KGM control workflow
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          gh workflow run tailscale-kgm-control.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main \
            -f operation=health

      - name: Record dispatch boundary
        shell: bash
        run: |
          set -Eeuo pipefail
          echo 'P19_SOAK_DISPATCH=PASS'
          echo 'P19_CONTROL_EVENT=workflow_dispatch'
          echo 'P19_CONTROL_OPERATION=health'
          echo 'P19_REAL_SOAK_ELAPSED_GATE=NOT_INFERRED_FROM_DISPATCH'
          echo 'PHASE_18_SHARED_RUNTIME_ACTIVE=NO'
          echo 'CANONICAL_CUTOVER_AUTHORIZED=NO'
          echo 'BETA_PAID_RESOURCES_AUTHORIZED=NO'
