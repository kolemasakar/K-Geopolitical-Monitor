name: One-off Phase 17 account capability documentation sync

on:
  push:
    paths:
      - '.github/workflows/oneoff_phase17_account_capability_sync.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Synchronize Phase 17 documentation and guards
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: Path, old: str, new: str) -> None:
              text = path.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected exactly one match, found {count}: {old[:120]!r}')
              path.write_text(text.replace(old, new, 1), encoding='utf-8')

          def append_once(path: Path, marker: str, block: str) -> None:
              text = path.read_text(encoding='utf-8')
              if marker in text:
                  return
              if not text.endswith('\n'):
                  text += '\n'
              path.write_text(text + '\n' + block.rstrip() + '\n', encoding='utf-8')

          roadmap = Path('ROADMAP.md')
          replace_once(roadmap, 'Version: 4.21', 'Version: 4.22')
          replace_once(
              roadmap,
              'State: `VALIDATED_READY / NOT_ACTIVATED`\nReadiness gate: `PHASE_17_CONTROLLED_EXTERNAL_PUBLICATION_READINESS_VALIDATED`\nActivation gate: `PHASE_17_ACTIVATION_REQUIRES_EXPLICIT_OWNER_DECISION`',
              'State: `VALIDATED_READY / NOT_ACTIVATED / EXTERNAL_PUBLICATION_BLOCKED_BY_CURRENT_ACCOUNT_CAPABILITY`\nReadiness gate: `PHASE_17_CONTROLLED_EXTERNAL_PUBLICATION_READINESS_VALIDATED`\nCapability gate: `PHASE_17_EXTERNAL_PUBLICATION_BLOCKED_BY_CURRENT_ACCOUNT_CAPABILITY`\nActivation gate: `PHASE_17_ACTIVATION_REQUIRES_EXPLICIT_OWNER_DECISION`\nCapability decision: `docs/decisions/PHASE_17_CURRENT_ACCOUNT_PUBLICATION_CAPABILITY_BOUNDARY_2026-09-05.md`',
          )
          replace_once(
              roadmap,
              'Phase 17 introduced no database migration; migration `033` remains uncreated/not pre-authorized. No real external publication target, owner execution, production/live operation, public ingress, public GPT Action, backend HTTPS, shared runtime or paid provider is activated by readiness closure. Actual publication remains separately gated by `PHASE_17_ACTIVATION_REQUIRES_EXPLICIT_OWNER_DECISION`.',
              'Phase 17 introduced no database migration; migration `033` remains uncreated/not pre-authorized. No real external publication target, owner execution, production/live operation, public ingress, public GPT Action, backend HTTPS, shared runtime or paid provider is activated by readiness closure. For the current account, actual external publication is additionally blocked by `PHASE_17_EXTERNAL_PUBLICATION_BLOCKED_BY_CURRENT_ACCOUNT_CAPABILITY`; owner approval alone cannot bypass this account/platform capability boundary. If the capability becomes available later, activation remains separately gated by `PHASE_17_ACTIVATION_REQUIRES_EXPLICIT_OWNER_DECISION` and fresh launch-time validation.',
          )
          replace_once(roadmap, '- state synchronization: `v4.21`;', '- state synchronization: `v4.22`;')
          replace_once(
              roadmap,
              '- Phase 17: `PHASE_17_CONTROLLED_EXTERNAL_PUBLICATION_READINESS_VALIDATED / VALIDATED_READY / NOT_ACTIVATED / OWNER_DECISION_REQUIRED`;',
              '- Phase 17: `PHASE_17_CONTROLLED_EXTERNAL_PUBLICATION_READINESS_VALIDATED / VALIDATED_READY / NOT_ACTIVATED / EXTERNAL_PUBLICATION_BLOCKED_BY_CURRENT_ACCOUNT_CAPABILITY / OWNER_DECISION_REQUIRED`;\n- Phase 17 current account publication capability: `UNAVAILABLE`;\n- Phase 17 capability decision: `docs/decisions/PHASE_17_CURRENT_ACCOUNT_PUBLICATION_CAPABILITY_BOUNDARY_2026-09-05.md`;',
          )
          replace_once(
              roadmap,
              'Phase 17 readiness is strategically closed at `PHASE_17_CONTROLLED_EXTERNAL_PUBLICATION_READINESS_VALIDATED`. External publication remains inactive and requires the explicit owner gate `PHASE_17_ACTIVATION_REQUIRES_EXPLICIT_OWNER_DECISION`. Phase 14 operational activation remains separately gated by `OWNER_ONLY_OPERATIONAL_ACTIVATION = OWNER_DECISION_REQUIRED`. Phase 18 remains conditional and requires new architecture approval; no production/live transition is implied.',
              'Phase 17 readiness is strategically closed at `PHASE_17_CONTROLLED_EXTERNAL_PUBLICATION_READINESS_VALIDATED`. For the current account, real external publication is unavailable and blocked by `PHASE_17_EXTERNAL_PUBLICATION_BLOCKED_BY_CURRENT_ACCOUNT_CAPABILITY`; an owner decision alone is insufficient while that capability boundary remains active. If the account/platform capability changes later, publication still requires `PHASE_17_ACTIVATION_REQUIRES_EXPLICIT_OWNER_DECISION` plus fresh launch-time validation. Phase 14 operational activation remains separately gated by `OWNER_ONLY_OPERATIONAL_ACTIVATION = OWNER_DECISION_REQUIRED`. Phase 18 remains conditional and requires new architecture approval; no production/live transition is implied.',
          )

          plan = Path('docs/implementation/PHASE_17_CONTROLLED_EXTERNAL_PUBLICATION_READINESS_PLAN.md')
          replace_once(
              plan,
              'Readiness gate: `PHASE_17_CONTROLLED_EXTERNAL_PUBLICATION_READINESS_VALIDATED`\nActivation gate: `PHASE_17_ACTIVATION_REQUIRES_EXPLICIT_OWNER_DECISION`',
              'Readiness gate: `PHASE_17_CONTROLLED_EXTERNAL_PUBLICATION_READINESS_VALIDATED`\nCurrent external publication capability: `UNAVAILABLE`\nCapability gate: `PHASE_17_EXTERNAL_PUBLICATION_BLOCKED_BY_CURRENT_ACCOUNT_CAPABILITY`\nActivation gate: `PHASE_17_ACTIVATION_REQUIRES_EXPLICIT_OWNER_DECISION`\nCapability decision: `docs/decisions/PHASE_17_CURRENT_ACCOUNT_PUBLICATION_CAPABILITY_BOUNDARY_2026-09-05.md`',
          )
          replace_once(
              plan,
              'Phase 17 engineering reached `VALIDATED_READY / NOT_ACTIVATED`. Actual publication remains a separate owner decision under `PHASE_17_ACTIVATION_REQUIRES_EXPLICIT_OWNER_DECISION`.',
              'Phase 17 engineering reached `VALIDATED_READY / NOT_ACTIVATED`. For the current account, actual external publication is unavailable and blocked by `PHASE_17_EXTERNAL_PUBLICATION_BLOCKED_BY_CURRENT_ACCOUNT_CAPABILITY`. If that account/platform capability changes later, actual publication still remains a separate owner decision under `PHASE_17_ACTIVATION_REQUIRES_EXPLICIT_OWNER_DECISION` and requires fresh launch-time validation.',
          )
          replace_once(
              plan,
              '- Any actual launch gate must revalidate then-current platform eligibility and publication requirements.\n\n## Authoritative Runtime / Security Boundary',
              '- Any actual launch gate must revalidate then-current platform eligibility and publication requirements.\n\n## Current Account Capability Boundary\n\nThe project owner has established that real external publication is unavailable for the current account. This is an account/platform capability constraint, not a Phase 17 engineering-readiness failure. While it remains active, no workflow may attempt a real publication target, and owner approval alone is insufficient to bypass the constraint.\n\nReopening the publication path requires a future account/platform state in which the needed capability exists. Even then, activation remains separately owner-gated by `PHASE_17_ACTIVATION_REQUIRES_EXPLICIT_OWNER_DECISION` and requires fresh launch-time platform, security, privacy, exposure and rollback validation. No account upgrade, paid plan, provider purchase or alternative external publication channel is implied or authorized by this state record.\n\n## Authoritative Runtime / Security Boundary',
          )
          replace_once(
              plan,
              '- any real target/provider requires a separate explicit owner activation decision.',
              '- any real target/provider requires both available account/platform publication capability and a separate explicit owner activation decision.',
          )
          replace_once(
              plan,
              'Phase 17 is therefore `VALIDATED_READY / NOT_ACTIVATED`. It must not set publication/sharing to active. Actual publication requires a later explicit owner decision plus then-current platform/security/privacy/exposure/rollback validation.',
              'Phase 17 is therefore `VALIDATED_READY / NOT_ACTIVATED`. It must not set publication/sharing to active. For the current account, actual external publication is blocked by `PHASE_17_EXTERNAL_PUBLICATION_BLOCKED_BY_CURRENT_ACCOUNT_CAPABILITY`. If that capability changes later, actual publication requires a later explicit owner decision plus then-current platform/security/privacy/exposure/rollback validation.',
          )
          replace_once(
              plan,
              'Plan decision: `COMPLETE / VALIDATED_READY / NOT_ACTIVATED`.\nP17.0 through P17.6 are validated. Strategic readiness gate `PHASE_17_CONTROLLED_EXTERNAL_PUBLICATION_READINESS_VALIDATED` is satisfied on closure anchor `daca1240cb1f99267795b39ddf7da32eb4fa9ec0`. Publication remains `NOT_ACTIVATED`; the next Phase 17 action is owner-only and requires `PHASE_17_ACTIVATION_REQUIRES_EXPLICIT_OWNER_DECISION`.',
              'Plan decision: `COMPLETE / VALIDATED_READY / NOT_ACTIVATED / EXTERNAL_PUBLICATION_BLOCKED_BY_CURRENT_ACCOUNT_CAPABILITY`.\nP17.0 through P17.6 are validated. Strategic readiness gate `PHASE_17_CONTROLLED_EXTERNAL_PUBLICATION_READINESS_VALIDATED` is satisfied on closure anchor `daca1240cb1f99267795b39ddf7da32eb4fa9ec0`. Publication remains `NOT_ACTIVATED`. For the current account, no real external publication action is available while `PHASE_17_EXTERNAL_PUBLICATION_BLOCKED_BY_CURRENT_ACCOUNT_CAPABILITY` remains active. If the account/platform capability changes later, activation still requires `PHASE_17_ACTIVATION_REQUIRES_EXPLICIT_OWNER_DECISION` and fresh launch-time validation.',
          )

          matrix = Path('docs/implementation/P17_6_VALIDATION_MATRIX.md')
          replace_once(
              matrix,
              'Phase readiness gate: `PHASE_17_CONTROLLED_EXTERNAL_PUBLICATION_READINESS_VALIDATED`\nActivation gate: `PHASE_17_ACTIVATION_REQUIRES_EXPLICIT_OWNER_DECISION`\nFinal decision: `VALIDATED_READY / NOT_ACTIVATED`',
              'Phase readiness gate: `PHASE_17_CONTROLLED_EXTERNAL_PUBLICATION_READINESS_VALIDATED`\nCapability gate: `PHASE_17_EXTERNAL_PUBLICATION_BLOCKED_BY_CURRENT_ACCOUNT_CAPABILITY`\nActivation gate: `PHASE_17_ACTIVATION_REQUIRES_EXPLICIT_OWNER_DECISION`\nCapability decision: `docs/decisions/PHASE_17_CURRENT_ACCOUNT_PUBLICATION_CAPABILITY_BOUNDARY_2026-09-05.md`\nFinal decision: `VALIDATED_READY / NOT_ACTIVATED / EXTERNAL_PUBLICATION_BLOCKED_BY_CURRENT_ACCOUNT_CAPABILITY`',
          )
          replace_once(
              matrix,
              '| Actual external publication remains separately owner-gated | PASS |',
              '| Current account external-publication capability is `UNAVAILABLE` and blocks real publication independently of owner approval | PASS |\n| If account/platform capability changes later, actual external publication remains separately owner-gated and requires fresh launch-time validation | PASS |',
          )
          replace_once(
              matrix,
              'Phase 17 is `VALIDATED_READY / NOT_ACTIVATED`. This readiness decision does not activate publication, public ingress, public GPT Action, backend HTTPS, owner execution, shared runtime or paid providers. Actual publication requires `PHASE_17_ACTIVATION_REQUIRES_EXPLICIT_OWNER_DECISION` plus then-current security, privacy, exposure, platform and rollback validation.',
              'Phase 17 is `VALIDATED_READY / NOT_ACTIVATED / EXTERNAL_PUBLICATION_BLOCKED_BY_CURRENT_ACCOUNT_CAPABILITY`. This readiness decision does not activate publication, public ingress, public GPT Action, backend HTTPS, owner execution, shared runtime or paid providers. For the current account, real external publication is unavailable and blocked independently of owner approval. If the account/platform capability changes later, actual publication still requires `PHASE_17_ACTIVATION_REQUIRES_EXPLICIT_OWNER_DECISION` plus then-current security, privacy, exposure, platform and rollback validation.',
          )

          test_plan = Path('tests/test_phase17_implementation_plan.py')
          replace_once(test_plan, 'assert "Version: 4.21" in roadmap', 'assert "Version: 4.22" in roadmap')
          append_once(
              test_plan,
              'def test_phase17_current_account_capability_boundary_is_synchronized():',
              '''def test_phase17_current_account_capability_boundary_is_synchronized():
              decision = ROOT / "docs" / "decisions" / "PHASE_17_CURRENT_ACCOUNT_PUBLICATION_CAPABILITY_BOUNDARY_2026-09-05.md"
              result = ROOT / "docs" / "implementation" / "PHASE_17_CONTROLLED_EXTERNAL_PUBLICATION_READINESS_RESULT.md"
              checkpoint = ROOT / "docs" / "checkpoints" / "PROJECT_CHECKPOINT_2026-09-05_PHASE_17_CONTROLLED_EXTERNAL_PUBLICATION_READINESS_VALIDATED_READY.md"
              corpus = "\n".join(_text(path) for path in (PLAN_PATH, ROADMAP_PATH, decision, result, checkpoint))
              assert "PHASE_17_EXTERNAL_PUBLICATION_BLOCKED_BY_CURRENT_ACCOUNT_CAPABILITY" in corpus
              assert "Current account publication capability: `UNAVAILABLE`" in _text(decision)
              assert "owner approval alone" in corpus.lower() or "owner approval by itself" in corpus.lower()
              assert "No account upgrade, paid plan, provider purchase or alternative publication channel is implied" in _text(decision)
              assert "Version: 4.22" in _text(ROADMAP_PATH)
              ''',
          )

          test_matrix = Path('tests/test_p17_6_phase17_validation_matrix.py')
          append_once(
              test_matrix,
              'def test_p17_6_current_account_capability_blocker_is_canonical_and_non_promotional():',
              '''def test_p17_6_current_account_capability_blocker_is_canonical_and_non_promotional():
              decision = ROOT / "docs" / "decisions" / "PHASE_17_CURRENT_ACCOUNT_PUBLICATION_CAPABILITY_BOUNDARY_2026-09-05.md"
              result = ROOT / "docs" / "implementation" / "PHASE_17_CONTROLLED_EXTERNAL_PUBLICATION_READINESS_RESULT.md"
              checkpoint = ROOT / "docs" / "checkpoints" / "PROJECT_CHECKPOINT_2026-09-05_PHASE_17_CONTROLLED_EXTERNAL_PUBLICATION_READINESS_VALIDATED_READY.md"
              for path in (PLAN, MATRIX, decision, result, checkpoint):
                  text = path.read_text(encoding="utf-8")
                  assert "PHASE_17_EXTERNAL_PUBLICATION_BLOCKED_BY_CURRENT_ACCOUNT_CAPABILITY" in text
              matrix_text = MATRIX.read_text(encoding="utf-8")
              assert "Current account external-publication capability is `UNAVAILABLE`" in matrix_text
              assert "blocks real publication independently of owner approval" in matrix_text
              ''',
          )

          # Cross-document sanity checks before committing.
          decision = Path('docs/decisions/PHASE_17_CURRENT_ACCOUNT_PUBLICATION_CAPABILITY_BOUNDARY_2026-09-05.md')
          result = Path('docs/implementation/PHASE_17_CONTROLLED_EXTERNAL_PUBLICATION_READINESS_RESULT.md')
          checkpoint = Path('docs/checkpoints/PROJECT_CHECKPOINT_2026-09-05_PHASE_17_CONTROLLED_EXTERNAL_PUBLICATION_READINESS_VALIDATED_READY.md')
          required = 'PHASE_17_EXTERNAL_PUBLICATION_BLOCKED_BY_CURRENT_ACCOUNT_CAPABILITY'
          for path in (roadmap, plan, matrix, decision, result, checkpoint):
              text = path.read_text(encoding='utf-8')
              if required not in text:
                  raise SystemExit(f'{path}: missing {required}')
          if 'Version: 4.22' not in roadmap.read_text(encoding='utf-8'):
              raise SystemExit('ROADMAP version synchronization failed')
          PY

      - name: Commit synchronized state and remove one-off workflow
        shell: bash
        run: |
          git config user.name "KGM documentation sync"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/oneoff_phase17_account_capability_sync.yml
          git add ROADMAP.md \
            docs/implementation/PHASE_17_CONTROLLED_EXTERNAL_PUBLICATION_READINESS_PLAN.md \
            docs/implementation/P17_6_VALIDATION_MATRIX.md \
            tests/test_phase17_implementation_plan.py \
            tests/test_p17_6_phase17_validation_matrix.py
          git commit -m "Synchronize Phase 17 account capability state"
          git push origin HEAD:main
