name: KGM SentinelX Cleanup

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/sentinelx-kgm-cleanup.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kgm-sentinelx-cleanup
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      E4_HOST: ${{ secrets.E4_HOST }}
      E4_SSH_PRIVATE_KEY: ${{ secrets.E4_SSH_PRIVATE_KEY }}
      E4_SSH_KNOWN_HOSTS: ${{ secrets.E4_SSH_KNOWN_HOSTS }}
      EXPECTED_SENTINELX_HOST_ID: host_a2767ee5915c4cfe
      EXPECTED_SENTINELX_CORE_SHA: e1be3162b22a4b0c744e0443c9f9b62f8fdb21a4
      EXPECTED_KGM_TS_IP: 100.102.136.23

    steps:
      - name: Validate pinned SSH inputs
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$E4_HOST"
          test -n "$E4_SSH_PRIVATE_KEY"
          test -n "$E4_SSH_KNOWN_HOSTS"
          install -d -m 0700 "$HOME/.ssh"
          printf '%s\n' "$E4_SSH_PRIVATE_KEY" > "$HOME/.ssh/id_kgm_cleanup"
          chmod 0600 "$HOME/.ssh/id_kgm_cleanup"
          printf '%s\n' "$E4_SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 0600 "$HOME/.ssh/known_hosts"

      - name: Audit exact KGM SentinelX footprint and replacement control plane
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh -i "$HOME/.ssh/id_kgm_cleanup" \
            -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=10 \
            "ubuntu@$E4_HOST" \
            "EXPECTED_SENTINELX_HOST_ID='$EXPECTED_SENTINELX_HOST_ID' EXPECTED_SENTINELX_CORE_SHA='$EXPECTED_SENTINELX_CORE_SHA' EXPECTED_KGM_TS_IP='$EXPECTED_KGM_TS_IP' sudo -n -E bash -s" <<'REMOTE'
          set -Eeuo pipefail

          INSTALL_DIR=/opt/sentinelx-cloud-core
          ETC_DIR=/etc/sentinelx
          UNIT=/etc/systemd/system/sentinelx-cloud-core.service
          SUDOERS=/etc/sudoers.d/sentinelx-kgm
          HELPER=/usr/local/sbin/sentinelx-kgm-journal
          DB=/opt/k-geopolitical-monitor/data/kgeopolitical_monitor.db

          test "$(hostname)" = kgm-e4-owner-pilot
          test "$(uname -m)" = aarch64
          test "$(systemctl is-active kgm-monitor.service)" = active
          test "$(systemctl is-enabled kgm-monitor.service)" = enabled
          test "$(systemctl is-active tailscaled)" = active
          test "$(systemctl is-enabled tailscaled)" = enabled
          test "$(tailscale ip -4)" = "$EXPECTED_KGM_TS_IP"
          tailscale status --json | jq -e '.BackendState == "Running" and .Self.Online == true and (.Self.Tags | index("tag:kgm") != null)' >/dev/null

          test -s "$ETC_DIR/host_id"
          test "$(cat "$ETC_DIR/host_id")" = "$EXPECTED_SENTINELX_HOST_ID"
          test -s "$ETC_DIR/identity.json"
          test -f "$UNIT"
          grep -Fq 'User=sentinelx' "$UNIT"
          grep -Fq 'ExecStart=/opt/sentinelx-cloud-core/.venv/bin/sentinelx-cloud-core' "$UNIT"
          test -f "$SUDOERS"
          visudo -cf "$SUDOERS" >/dev/null
          test -x "$HELPER"
          test -d "$INSTALL_DIR/.git"
          test "$(sudo -u sentinelx git -C "$INSTALL_DIR" rev-parse HEAD)" = "$EXPECTED_SENTINELX_CORE_SHA"

          passwd_entry="$(getent passwd sentinelx)"
          test -n "$passwd_entry"
          test "$(printf '%s' "$passwd_entry" | cut -d: -f6)" = "$INSTALL_DIR"
          test "$(printf '%s' "$passwd_entry" | cut -d: -f7)" = /usr/sbin/nologin
          test "$(id -nG sentinelx | tr ' ' '\n' | grep -Fxc docker || true)" -eq 0
          test "$(id -nG sentinelx | tr ' ' '\n' | grep -Fxc kgm || true)" -eq 0

          id kgmops >/dev/null
          test "$(id -nG kgmops | tr ' ' '\n' | grep -Fxc docker || true)" -eq 0
          test "$(id -nG kgmops | tr ' ' '\n' | grep -Fxc kgm || true)" -eq 0
          if sudo -u kgmops sudo -n /bin/bash -c 'id -u' >/dev/null 2>&1; then
            echo 'kgmops arbitrary root escalation unexpectedly allowed' >&2
            exit 51
          fi
          test ! -e "$DB" || ! sudo -u kgmops test -r "$DB"
          sudo -u kgmops sudo -n /usr/bin/systemctl is-active kgm-monitor.service >/dev/null

          echo 'KGM_SENTINELX_CLEANUP_AUDIT=PASS'
          echo "sentinelx_host_id=$(cat "$ETC_DIR/host_id")"
          echo "sentinelx_core_sha=$(sudo -u sentinelx git -C "$INSTALL_DIR" rev-parse HEAD)"
          echo "kgm_tailscale_ip=$(tailscale ip -4)"
          REMOTE

      - name: Remove only verified KGM SentinelX footprint
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh -i "$HOME/.ssh/id_kgm_cleanup" \
            -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=10 \
            "ubuntu@$E4_HOST" \
            "EXPECTED_SENTINELX_HOST_ID='$EXPECTED_SENTINELX_HOST_ID' sudo -n -E bash -s" <<'REMOTE'
          set -Eeuo pipefail

          INSTALL_DIR=/opt/sentinelx-cloud-core
          ETC_DIR=/etc/sentinelx
          UNIT=/etc/systemd/system/sentinelx-cloud-core.service
          SUDOERS=/etc/sudoers.d/sentinelx-kgm
          HELPER=/usr/local/sbin/sentinelx-kgm-journal

          test "$(cat "$ETC_DIR/host_id")" = "$EXPECTED_SENTINELX_HOST_ID"
          test "$(hostname)" = kgm-e4-owner-pilot

          systemctl disable --now sentinelx-cloud-core.service >/dev/null 2>&1 || true
          if systemctl is-active --quiet sentinelx-cloud-core.service; then
            echo 'SentinelX service did not stop' >&2
            exit 61
          fi

          rm -f "$UNIT"
          rm -f "$SUDOERS"
          rm -f "$HELPER"
          rm -rf "$ETC_DIR"
          rm -rf "$INSTALL_DIR"
          rm -rf /var/lib/sentinelx/uploads
          rmdir /var/lib/sentinelx 2>/dev/null || true

          systemctl daemon-reload
          systemctl reset-failed sentinelx-cloud-core.service >/dev/null 2>&1 || true

          if id sentinelx >/dev/null 2>&1; then
            if pgrep -u sentinelx >/dev/null 2>&1; then
              echo 'SentinelX user still has running processes' >&2
              exit 62
            fi
            userdel sentinelx
          fi
          if getent group sentinelx >/dev/null 2>&1; then
            groupdel sentinelx
          fi

          echo 'KGM_SENTINELX_LOCAL_REMOVE=PASS'
          REMOTE

      - name: Validate KGM after SentinelX removal
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh -i "$HOME/.ssh/id_kgm_cleanup" \
            -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=10 \
            "ubuntu@$E4_HOST" \
            "EXPECTED_KGM_TS_IP='$EXPECTED_KGM_TS_IP' sudo -n -E bash -s" <<'REMOTE'
          set -Eeuo pipefail
          DB=/opt/k-geopolitical-monitor/data/kgeopolitical_monitor.db

          ! id sentinelx >/dev/null 2>&1
          test ! -e /etc/sentinelx
          test ! -e /opt/sentinelx-cloud-core
          test ! -e /etc/systemd/system/sentinelx-cloud-core.service
          test ! -e /etc/sudoers.d/sentinelx-kgm
          test ! -e /usr/local/sbin/sentinelx-kgm-journal
          test ! -e /var/lib/sentinelx/uploads
          ! systemctl list-unit-files sentinelx-cloud-core.service --no-legend 2>/dev/null | grep -q sentinelx-cloud-core

          test "$(systemctl is-active kgm-monitor.service)" = active
          test "$(systemctl is-enabled kgm-monitor.service)" = enabled
          test "$(systemctl is-active tailscaled)" = active
          test "$(systemctl is-enabled tailscaled)" = enabled
          test "$(tailscale ip -4)" = "$EXPECTED_KGM_TS_IP"
          tailscale status --json | jq -e '.BackendState == "Running" and .Self.Online == true and (.Self.Tags | index("tag:kgm") != null)' >/dev/null

          id kgmops >/dev/null
          test "$(id -nG kgmops | tr ' ' '\n' | grep -Fxc docker || true)" -eq 0
          test "$(id -nG kgmops | tr ' ' '\n' | grep -Fxc kgm || true)" -eq 0
          if sudo -u kgmops sudo -n /bin/bash -c 'id -u' >/dev/null 2>&1; then
            echo 'kgmops arbitrary root escalation unexpectedly allowed after cleanup' >&2
            exit 71
          fi
          test ! -e "$DB" || ! sudo -u kgmops test -r "$DB"
          sudo -u kgmops sudo -n /usr/bin/systemctl is-active kgm-monitor.service >/dev/null
          sudo -u kgmops sudo -n /usr/local/sbin/kgmops-journal 5 >/dev/null

          echo 'KGM_SENTINELX_CLEANUP=PASS'
          echo 'kgm_service=active'
          echo "kgm_tailscale_ip=$(tailscale ip -4)"
          echo 'runtime_db_read=DENIED'
          echo 'kgmops_arbitrary_root=DENIED'
          REMOTE
