name: P12.3 Controlled Live Source Smoke

on:
  push:
    paths:
      - "scripts/p12_3_live_source_smoke.py"
      - ".github/workflows/p12_3-controlled-live-smoke.yml"
      - "src/kgeopolitical_monitor/authoritative_source_pack.py"
      - "src/kgeopolitical_monitor/adapter_framework.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  controlled-live-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install project
        run: python -m pip install -e .
      - name: Run P12.3 controlled-live source smoke
        run: python scripts/p12_3_live_source_smoke.py
