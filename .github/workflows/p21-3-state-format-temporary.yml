name: Temporary P21.3 state JSON format

on:
  push:
    branches:
      - phase21/p21-3-closure-p21-4-ready
    paths:
      - .github/workflows/p21-3-state-format-temporary.yml

permissions:
  contents: write

jobs:
  format-state:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: phase21/p21-3-closure-p21-4-ready
      - name: Canonically format current project state
        shell: python
        run: |
          import json
          from pathlib import Path
          p = Path("docs/state/CURRENT_PROJECT_STATE.json")
          data = json.loads(p.read_text(encoding="utf-8"))
          assert data["roadmap"]["state_sync_version"] == "4.40"
          assert data["roadmap"]["current_position"] == "PHASE_21_P21_3_VALIDATED_P21_4_READY"
          p.write_text(json.dumps(data, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
      - name: Commit formatted state
        run: |
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/state/CURRENT_PROJECT_STATE.json
          git commit -m 'Normalize P21.3 closure state formatting'
          git push origin HEAD:phase21/p21-3-closure-p21-4-ready
