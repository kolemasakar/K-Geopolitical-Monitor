name: P24 Observability Readonly Qualification
on:
  pull_request:
    paths:
      - "ops/p24_observability/**"
      - "tests/test_p24_readonly_metrics.py"
      - ".github/workflows/p24-observability-readonly.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s tests -p test_p24_readonly_metrics.py -v
