name: P19 Owner-Local Real Soak Contract

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p19-owner-local-real-soak.yml'
      - '.github/workflows/p19-owner-local-real-soak-dispatch.yml'
      - '.github/workflows/p19-owner-local-soak-gate-audit.yml'
      - '.github/workflows/tailscale-kgm-control.yml'
      - 'scripts/p19_soak_gate.py'
      - 'tests/test_p19_soak_gate.py'
      - 'docs/checkpoints/PROJECT_CHECKPOINT_2026-09-10_PHASE_19_OWNER_LOCAL_REAL_SOAK_IN_PROGRESS.md'

permissions:
  contents: read

jobs:
  contract-check:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout PR revision
        uses: actions/checkout@v5

      - name: Verify authorized fail-closed soak contract
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path

          control = Path('.github/workflows/tailscale-kgm-control.yml').read_text(encoding='utf-8')
          dispatcher = Path('.github/workflows/p19-owner-local-real-soak-dispatch.yml').read_text(encoding='utf-8')
          audit = Path('.github/workflows/p19-owner-local-soak-gate-audit.yml').read_text(encoding='utf-8')
          evaluator = Path('scripts/p19_soak_gate.py').read_text(encoding='utf-8')

          control_required = (
              'workflow_dispatch:',
              "expected_host='kgm-e4-owner-pilot'",
              "expected_ip='100.102.136.23'",
              'inputs.operation',
              '-e "operation=$KGM_OPERATION"',
              'P19_REAL_SOAK_OBSERVATION=PASS',
              'P19_REAL_SOAK_ELAPSED_GATE=NOT_INFERRED_FROM_SINGLE_OBSERVATION',
              'P19_REAL_SOAK_BASELINE_UTC=2026-09-10T00:19:31Z',
              'BETA_PAID_RESOURCES_AUTHORIZED=NO',
          )
          missing_control = [value for value in control_required if value not in control]
          if missing_control:
              raise SystemExit(f'missing control invariants: {missing_control}')

          if "cron:" in control or "branches: [main]" in control:
              raise SystemExit('Tailscale control workflow must remain workflow_dispatch-only')

          dispatcher_required = (
              "cron: '27 */6 * * *'",
              'actions: write',
              'gh workflow run tailscale-kgm-control.yml',
              '--ref main',
              '-f operation=health',
              '(.conclusion // "NONE")',
              'join("|")',
              "IFS='|' read -r status conclusion head_sha event",
              'P19_CONTROL_RESULT=PASS',
              'gh workflow run p19-owner-local-soak-gate-audit.yml',
              'P19_SOAK_AUDIT_DISPATCH=PASS',
              'P19_CONTROL_EVENT=workflow_dispatch',
              'P19_CONTROL_OPERATION=health',
              'P19_AUDIT_EVENT=workflow_dispatch',
              'P19_REAL_SOAK_ELAPSED_GATE=NOT_INFERRED_FROM_DISPATCH',
          )
          missing_dispatcher = [value for value in dispatcher_required if value not in dispatcher]
          if missing_dispatcher:
              raise SystemExit(f'missing dispatcher invariants: {missing_dispatcher}')

          control_dispatch_pos = dispatcher.index('gh workflow run tailscale-kgm-control.yml')
          control_pass_pos = dispatcher.index('P19_CONTROL_RESULT=PASS')
          audit_dispatch_pos = dispatcher.index('gh workflow run p19-owner-local-soak-gate-audit.yml')
          if not control_dispatch_pos < control_pass_pos < audit_dispatch_pos:
              raise SystemExit('Elapsed audit must be dispatched only after successful KGM health control')

          audit_required = (
              'workflow_dispatch:',
              'workflow_run:',
              'KGM Tailscale Ansible Control',
              "cron: '47 */6 * * *'",
              'actions: read',
              'scripts/p19_soak_gate.py',
              "--baseline '2026-09-10T00:19:31Z'",
              '--max-gap-hours 7',
              'P19 Owner-Local Soak Gate Audit',
              'actions/upload-artifact@v4',
          )
          missing_audit = [value for value in audit_required if value not in audit]
          if missing_audit:
              raise SystemExit(f'missing audit invariants: {missing_audit}')

          evaluator_required = (
              'MILESTONE_HOURS = (24, 72, 168)',
              'WAITING_TERMINAL_OBSERVATION',
              'FAIL_CONTINUITY',
              'P19_REAL_24H_SOAK=',
              'P19_REAL_72H_SOAK=',
              'P19_REAL_7D_SOAK=',
          )
          missing_evaluator = [value for value in evaluator_required if value not in evaluator]
          if missing_evaluator:
              raise SystemExit(f'missing evaluator invariants: {missing_evaluator}')

          forbidden_live_action = 'tailscale/' + 'github-action@'
          if forbidden_live_action in dispatcher:
              raise SystemExit('Dispatcher must not create its own Tailscale trust path')
          if forbidden_live_action in audit:
              raise SystemExit('Audit workflow must not create a Tailscale trust path')
          if 'actions: write' in audit:
              raise SystemExit('Audit workflow must remain read-only')

          print('P19_AUTHORIZED_SOAK_DISPATCH_CHAIN=PASS')
          print('P19_ELAPSED_SOAK_GATE_AUDIT_CONTRACT=PASS')
          print('P19_CONTROL_THEN_AUDIT_ORDERING=PASS')
          print('P19_CONTROL_STATE_PARSE_CONTRACT=PASS')
          PY
