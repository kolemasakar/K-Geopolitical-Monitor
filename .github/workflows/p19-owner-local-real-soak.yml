name: P19 Owner-Local Real Soak Contract

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p19-owner-local-real-soak.yml'
      - '.github/workflows/tailscale-kgm-control.yml'
      - 'docs/checkpoints/PROJECT_CHECKPOINT_2026-09-10_PHASE_19_OWNER_LOCAL_REAL_SOAK_IN_PROGRESS.md'

permissions:
  contents: read

jobs:
  contract-check:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout PR revision
        uses: actions/checkout@v5

      - name: Verify authorized fail-closed soak contract
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path

          control = Path('.github/workflows/tailscale-kgm-control.yml').read_text(encoding='utf-8')
          contract = Path('.github/workflows/p19-owner-local-real-soak.yml').read_text(encoding='utf-8')

          required = (
              "cron: '17 */6 * * *'",
              "expected_host='kgm-e4-owner-pilot'",
              "expected_ip='100.102.136.23'",
              "KGM_OPERATION: ${{ github.event_name == 'workflow_dispatch' && inputs.operation || 'health' }}",
              "-e \"operation=$KGM_OPERATION\"",
              'P19_REAL_SOAK_OBSERVATION=PASS',
              'P19_REAL_SOAK_ELAPSED_GATE=NOT_INFERRED_FROM_SINGLE_OBSERVATION',
              'P19_REAL_SOAK_BASELINE_UTC=2026-09-10T00:19:31Z',
              'BETA_PAID_RESOURCES_AUTHORIZED=NO',
          )
          missing = [value for value in required if value not in control]
          if missing:
              raise SystemExit(f'missing authorized soak invariants: {missing}')

          if 'tailscale/github-action@' in contract:
              raise SystemExit('P19 contract workflow must not create a second OIDC/Tailscale trust path')
          if 'schedule:' in contract:
              raise SystemExit('P19 contract workflow must not schedule a second live observer')

          print('P19_AUTHORIZED_SOAK_CONTRACT=PASS')
          PY
