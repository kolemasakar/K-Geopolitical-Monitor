name: Temporary P18.1 Closure Builder

on:
  push:
    branches:
      - docs/p18-1-formal-closure

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout closure branch
        uses: actions/checkout@v5
        with:
          ref: docs/p18-1-formal-closure
          fetch-depth: 0
      - name: Generate formal closure
        run: python tools/_tmp_p18_1_closure_builder.py
      - name: Commit generated closure
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Close P18.1 identity and authenticated tenant context"
          git push origin HEAD:docs/p18-1-formal-closure
